<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survive! Grass plain</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2b1b6b;font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,sans-serif;font-weight:800;color:#2a1a5e;touch-action:none;user-select:none}
canvas{display:block}
.pill{position:fixed;bottom:16px;left:16px;background:#fff;border:2px solid #111;box-shadow:0 3px 0 #111;border-radius:999px;padding:4px 14px;font-size:15px;pointer-events:none}
#bag{position:fixed;left:16px;top:16px;width:76px;height:76px;border-radius:22px;cursor:pointer;padding:0;display:grid;place-items:center;background:#8a5a2f;border:2px solid #111;box-shadow:0 3px 0 #111}
#bag:active{transform:translateY(3px);box-shadow:0 1px 0 #111}
#bag img{width:60px;height:60px}
#badge{position:absolute;top:-10px;right:-12px;background:#fff;color:#2a1a5e;border:2px solid #111;border-radius:999px;min-width:26px;padding:0 6px;font-size:14px;line-height:20px;text-align:center}
#inv{position:fixed;left:16px;top:108px;width:min(372px,calc(100vw - 32px));border-radius:24px;padding:14px;display:none;background:#8a5a2f;border:2px solid #111;box-shadow:0 3px 0 #111;color:#fff}
#inv.on{display:block;animation:pop .14s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.hd{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px;font-size:20px}
.hd small{font-size:14px;opacity:.8;margin-left:8px}
#x{font:inherit;cursor:pointer;color:#fff;background:#ff3b4e;border:2px solid #111;border-radius:12px;width:34px;height:34px;box-shadow:0 3px 0 #111}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.s{position:relative;aspect-ratio:1;background:#d9b78c;border:2px solid #111;border-radius:14px;display:grid;place-items:center}
.s.food{cursor:pointer}
.s img{width:72%;height:72%}
.s b{position:absolute;right:2px;bottom:1px;background:#fff;color:#2a1a5e;border:2px solid #111;border-radius:999px;font-size:12px;line-height:14px;padding:0 6px}
#stats{position:fixed;top:16px;right:16px;display:grid;gap:14px;pointer-events:none}
.row{position:relative;padding-right:22px}
.bar{position:relative;width:min(210px,40vw);height:24px;background:#fff;border:2px solid #111;border-radius:999px;box-shadow:0 3px 0 #111;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;width:100%;transition:width .15s}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 2px),rgba(42,26,94,.45) calc(10% - 2px) 10%)}
#hp{background:#ff3b4e}#fd{background:#a8693a}
.row img{position:absolute;right:0;top:50%;width:42px;height:42px;transform:translateY(-55%)}
#hotbar{position:fixed;left:108px;top:16px;height:80px;box-sizing:border-box;display:flex;align-items:center;gap:6px;padding:0 10px;background:#8a5a2f;border:2px solid #111;border-radius:22px;box-shadow:0 3px 0 #111;--hs:min(56px,calc((100vw - 150px)/5.7))}
.hs{width:var(--hs);height:var(--hs);flex:none;aspect-ratio:auto;cursor:pointer}
.s i{position:absolute;left:5px;top:2px;font-style:normal;font-size:11px;color:#111;opacity:.75}
.s.sel{background:#f3dfbd;outline:3px solid #fff;outline-offset:-1px;box-shadow:0 0 0 2px #111}
.lbl{margin:12px 4px 6px;font-size:15px;opacity:.85}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#fff;border:2px solid #111;border-radius:999px;box-shadow:0 3px 0 #111;padding:5px 16px;font-size:15px;display:none;pointer-events:none}
.tabs{display:flex;gap:6px}
.tab{font:inherit;color:#fff;background:transparent;border:2px solid transparent;border-radius:12px;padding:3px 12px;cursor:pointer}
.tab.on{background:#d9b78c;color:#111;border-color:#111}
.cap{display:block;margin:0 4px 6px;opacity:.85;font-size:14px}
.g6{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.s.can:not(.sel){box-shadow:0 0 0 2px #2ecc71}
#cdet{margin-top:12px;background:#d9b78c;color:#111;border:2px solid #111;border-radius:14px;padding:10px 12px;min-height:84px;font-size:15px}
#cdet .need{display:flex;flex-wrap:wrap;gap:4px 12px;margin:6px 0 8px}
#cdet .need span{display:inline-flex;align-items:center;gap:4px;font-size:14px}
#cdet .need img{width:22px;height:22px}
#cdet .no{color:#a3122a}#cdet .ok{color:#136b2f}
#cdet small{opacity:.7}
.cbtn{font:inherit;cursor:pointer;color:#111;background:#2ecc71;border:2px solid #111;border-radius:999px;padding:3px 18px;box-shadow:0 3px 0 #111;margin-right:8px}
.cbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #111}
#abar{display:none;justify-content:flex-end;padding-right:22px}
#abar img{width:22px;height:22px}
#reel{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);width:min(340px,80vw);display:none;pointer-events:none;text-align:center}
#reel b{display:block;margin-bottom:8px;background:#fff;border:2px solid #111;border-radius:999px;padding:3px 14px;box-shadow:0 3px 0 #111;font-size:14px;color:#111}
#rbar{position:relative;height:26px;background:#fff;border:2px solid #111;border-radius:999px;box-shadow:0 3px 0 #111;overflow:hidden}
#zone{position:absolute;top:0;bottom:0;background:#2ecc71;border-left:2px solid #111;border-right:2px solid #111;box-sizing:border-box}
#cur{position:absolute;top:0;bottom:0;width:5px;margin-left:-2px;background:#ff3b4e;border:1.5px solid #111;box-sizing:border-box}
@media (prefers-reduced-motion:reduce){#inv.on{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock" class="pill"></div>
<button id="bag" aria-label="Backpack"><img id="bi" alt=""><span id="badge">0</span></button>
<div id="inv"><div class="hd"><span class="tabs"><button id="tb" class="tab on">Backpack</button><button id="tc" class="tab">Crafting</button></span><button id="x" aria-label="Close">✕</button></div><div id="bagv"><small id="cap" class="cap"></small><div id="grid"></div><div class="lbl">Armor</div><div id="parm" class="g5"></div><div class="lbl">Hotbar (drag items here)</div><div id="phot" class="g5"></div></div><div id="craftv" style="display:none"><div id="cgrid" class="g6"></div><div id="cdet"></div></div></div>
<div id="hotbar"></div>
<div id="toast"></div>
<div id="reel"><b>Fish on! Right-click when the red line is in the green</b><div id="rbar"><div id="zone"></div><div id="cur"></div></div></div>
<div id="stats">
  <div class="row"><div class="bar"><i id="hp"></i></div><img id="hi" alt="Health"></div>
  <div class="row"><div class="bar"><i id="fd"></i></div><img id="fi" alt="Hunger"></div>
  <div id="abar"></div>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('c');
let ctx=cv.getContext('2d'),W,H;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}
addEventListener('resize',rs);rs();

const CS=800,INK='#111',REACH=40,STACK=64,SLOTS=20,WSEED=Math.floor(Math.random()*1e9);
const keys={},m={down:false};
const CODEKEY={KeyW:'w',KeyA:'a',KeyS:'s',KeyD:'d',ArrowUp:'arrowup',ArrowDown:'arrowdown',ArrowLeft:'arrowleft',ArrowRight:'arrowright'};
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),rnd=(a,b)=>a+Math.random()*(b-a);
const tog=()=>$('inv').classList.toggle('on');
let jumpReq=0;
let tt=0;function say(m,c){const e=$('toast');e.textContent=m;e.style.display='block';e.style.borderColor=c||'#111';clearTimeout(tt);tt=setTimeout(()=>{e.style.display='none'},c?2600:1600)}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(),wc=CODEKEY[e.code];keys[k]=1;if(wc)keys[wc]=1;
  if(e.code==='Space'){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(!e.repeat)jumpReq=.14}
  if(k==='i'||k==='b')openTab('bag');
  if(k==='c')openTab('craft');
  if(k==='e'&&!e.repeat)toggleBoat();
  if(k==='escape')$('inv').classList.remove('on');
  const dg=/^(?:Digit|Numpad)([1-5])$/.exec(e.code);
  if(dg){sel=+dg[1]-1;render()}else if(k.length===1&&k>='1'&&k<='5'){sel=+k-1;render()}
  if(k==='f'&&!e.repeat){const hs=hot[sel];if(hs&&FOOD[hs.t])eat(hot,sel);else{const i=inv.findIndex(q=>q&&FOOD[q.t]);if(i>=0)eat(inv,i)}}
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0;const wc=CODEKEY[e.code];if(wc)keys[wc]=0});
const stopAll=()=>{for(const q in keys)keys[q]=0;m.down=false};
addEventListener('blur',stopAll);
document.addEventListener('visibilitychange',stopAll);
cv.addEventListener('pointerdown',e=>{m.x=e.clientX;m.y=e.clientY;if(e.button===2){aimAtPointer();if(!interactBoat())useItem()}else m.down=true});
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('pointermove',e=>{m.x=e.clientX;m.y=e.clientY});
addEventListener('pointerup',()=>{m.down=false});
$('bag').onclick=tog;$('x').onclick=tog;

const IT={wood:'Wood',stone:'Stone',copper:'Copper Ore',iron:'Iron Ore',apple:'Apple',sapling:'Sapling',pork:'Raw Pork',chicken:'Raw Chicken',steak:'Raw Steak',wolfmeat:'Raw Wolf Meat',bearmeat:'Raw Bear Meat',leather:'Leather',stick:'Stick',string:'Leather String',fishing_rod:'Fishing Rod',boat:'Wooden Boat',seeds:'Wheat Seeds',wheat:'Wheat',bread:'Bread'};
const MATS=['wood','stone','copper','iron'],MN=['Wooden','Stone','Copper','Iron'],MC=['#b9743f','#b4bdd0','#ff8a3d','#d4dcee'],SPD=[1.6,2.2,3,4.5],SWD=[6,8,10,13];
const TOOL={};
MATS.forEach((mt,i)=>{for(const [k,n] of[['pick','Pickaxe'],['axe','Axe'],['sword','Sword'],['hoe','Hoe']]){TOOL[k+'_'+mt]={k,tier:i+1,sp:SPD[i],dmg:SWD[i],c:MC[i]};IT[k+'_'+mt]=MN[i]+' '+n}});
// armor: four pieces per material (helmet, chestplate, leggings, boots); full sets give leather 7, copper 11, iron 16 points = 3.5 / 5.5 / 8 bars
const PIECES=[['helmet','Helmet'],['chest','Chestplate'],['legs','Leggings'],['boots','Boots']];
const AMAT={leather:{n:'Leather',c:'#b97a42',d:'#7a4a24',pts:[1,3,2,1],cost:[2,4,3,2],res:'leather'},copper:{n:'Copper',c:'#ff8a3d',d:'#c9561a',pts:[2,5,3,1],cost:[3,5,4,2],res:'copper'},iron:{n:'Iron',c:'#d4dcee',d:'#8c9cba',pts:[2,6,5,3],cost:[3,5,4,2],res:'iron'}};
const ARM={};
for(const mt in AMAT)PIECES.forEach((pc,i)=>{const id='armor_'+mt+'_'+pc[0];ARM[id]={slot:i,pts:AMAT[mt].pts[i],c:AMAT[mt].c,d:AMAT[mt].d,mat:mt,pc:pc[0]};IT[id]=AMAT[mt].n+' '+(mt==='leather'&&i===1?'Coat':pc[1])});
// fish: 8 kinds across 6 rarity tiers; rarer fish are harder to reel in (smaller green zone, faster line)
const RAR=[['Common','#cfd6e6'],['Uncommon','#5cd66f'],['Rare','#4aa8ff'],['Epic','#b06bff'],['Legendary','#ffb020'],['Mythic','#ff4d8d']];
const FISH=[
  {id:'fish_minnow',n:'Minnow',r:0,w:24,food:6,win:.36,sp:.70},
  {id:'fish_carp',n:'Carp',r:0,w:22,food:12,win:.32,sp:.78},
  {id:'fish_perch',n:'Perch',r:1,w:16,food:16,win:.28,sp:.88},
  {id:'fish_catfish',n:'Catfish',r:1,w:12,food:22,win:.25,sp:.98},
  {id:'fish_salmon',n:'Salmon',r:2,w:14,food:30,win:.22,sp:1.08},
  {id:'fish_koi',n:'Golden Koi',r:3,w:7,food:38,win:.19,sp:1.15},
  {id:'fish_angler',n:'Anglerfish',r:4,w:3.5,food:48,win:.17,sp:1.22},
  {id:'fish_dragon',n:'Dragonfish',r:5,w:1.5,food:70,win:.15,sp:1.30}
];
// where you fish changes what bites: rivers favour salmon, lakes favour koi and catfish, the open ocean holds the legendary fish
const FMULT={
  river:{fish_minnow:1.3,fish_carp:1.3,fish_perch:1,fish_catfish:.9,fish_salmon:2.2,fish_koi:.7,fish_angler:.1,fish_dragon:.15},
  lake:{fish_minnow:.9,fish_carp:1.2,fish_perch:1.4,fish_catfish:1.4,fish_salmon:.6,fish_koi:2,fish_angler:.3,fish_dragon:.4},
  ocean:{fish_minnow:.5,fish_carp:.4,fish_perch:.4,fish_catfish:.8,fish_salmon:1.3,fish_koi:1,fish_angler:3.5,fish_dragon:3}
};
const FISHBY={};
const FOOD={pork:30,chicken:20,steak:40,apple:15,wolfmeat:45,bearmeat:55,bread:28};
FISH.forEach(f=>{IT[f.id]=f.n;FOOD[f.id]=f.food;FISHBY[f.id]=f});
const LOOT={pig:[['pork',2,3]],chicken:[['chicken',1,2]],cow:[['steak',2,3],['leather',1,2]],wolf:[['wolfmeat',2,3]],bear:[['bearmeat',3,5]]};
const DROP={tree:'wood',rock:'stone',copper:'copper',iron:'iron'};
const TIME={tree:2.2,apple:2.2,rock:4,copper:6,iron:9,boat:1.2,grass:.3,soil:.45};
const NEED={rock:1,copper:2,iron:3},MSG={rock:'Rock needs a wooden pickaxe or better',copper:'Copper needs a stone pickaxe or better',iron:'Iron needs a copper pickaxe or better'};
const STK=t=>TOOL[t]||ARM[t]||t==='fishing_rod'||t==='boat'?1:STACK;
const NOCOL=new Set(['sapling','boat','grass','soil']);
const PAL=[['#35b562','#4fd37c'],['#2fa85d','#47c86f'],['#47bd66','#69dc88']];
const S={hp:100,food:100};

// ---------- world: infinite, built from chunks and remembered ----------
const objs=[],drops=[],animals=[],pops=[],CH=new Map();
const P={x:0,y:0,vx:0,vy:0,r:18,sp:220,bob:0,ang:Math.PI/2,moving:false,mining:false,boat:null,act:0,z:0,vz:0,sq:0,cd:0,jx:0,jy:0,wb:0,hintT:0};
let GT=120,hurtT=0,lastCk='',lastTxt='';
const cam={x:-innerWidth/2,y:-innerHeight/2};
const darkness=()=>{const q=GT%1200;return q<560?0:q<600?(q-560)/40:q<1160?1:1-(q-1160)/40};
const rng=sd=>{let a=sd>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}};
const hh=(a,b,c)=>{let h=Math.imul(a,374761393)^Math.imul(b,668265263)^Math.imul(c,2246822519)^WSEED;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
const AN={pig:{r:16,hp:6,sp:36},chicken:{r:10,hp:3,sp:48},cow:{r:23,hp:10,sp:24},wolf:{r:15,hp:14,sp:80,host:1,dmg:6},bear:{r:26,hp:40,sp:58,host:1,dmg:14}};
const drop=(t,x,y,n,a)=>drops.push({t,n:n||1,x,y,vx:rnd(-130,130),vy:rnd(-130,130),a:a||0});
function mk(kind,x,y){const c=AN[kind];animals.push({an:1,type:kind,x,y,r:c.r,hp:c.hp,mhp:c.hp,sp:c.sp,host:c.host,dmg:c.dmg,vx:0,vy:0,kx:0,ky:0,hit:0,wt:0,fl:0,cd:0,face:1,fs:1,seed:Math.random()*100})}
// ---------- terrain: oceans, rivers, lakes and biomes from smooth noise (Minecraft-style) ----------
const GS=20,GN=CS/GS;
const h2=(ix,iy,sd)=>{let h=Math.imul(ix,374761393)^Math.imul(iy,668265263)^Math.imul(sd,2246822519)^WSEED;h=Math.imul(h^h>>>13,1274126177);return((h^h>>>16)>>>0)/4294967296};
function vn(x,y,sd){
  const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy,ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
  const a=h2(ix,iy,sd),b=h2(ix+1,iy,sd),c=h2(ix,iy+1,sd),d=h2(ix+1,iy+1,sd);
  return(a+(b-a)*ux+(c-a)*uy+(a-b-c+d)*ux*uy)*2-1;
}
const fbm=(x,y,sd,o)=>{let v=0,a=1,t=0,f=1;for(let i=0;i<o;i++){v+=vn(x*f,y*f,sd+i*7)*a;t+=a;a*=.5;f*=2}return v/t};
const sstep=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};
// negative values are water: ocean (low continents), river (ridges of a warped noise, like Minecraft) or lake. The spawn area is always land.
// lakes are wobbly round pools, at least ~70px across, scattered on a jittered grid and never near the spawn
function lakeTerm(x,y){
  const LC=560,cx0=Math.floor(x/LC),cy0=Math.floor(y/LC);let best=1e9;
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){
    const ci=cx0+i,cj=cy0+j;
    if(h2(ci,cj,61)>.32)continue;
    const lx=(ci+.15+h2(ci,cj,62)*.7)*LC,ly=(cj+.15+h2(ci,cj,63)*.7)*LC,R=70+h2(ci,cj,64)*85;
    if(Math.hypot(lx,ly)<R+560)continue;
    const re=R*(1+.28*vn(x/170,y/170,65));
    best=Math.min(best,(Math.hypot(x-lx,y-ly)-re)/600);
  }
  return best;
}
const ocF=(x,y)=>fbm(x/3400,y/3400,11,2)+Math.max(0,1-Math.hypot(x,y)/1500)*1.1+.34;
function wfParts(x,y){
  const d=Math.hypot(x,y);
  const oc=ocF(x,y);
  // rivers: zero-lines of a warped, large-scale noise (so they are rare and wind like Minecraft rivers), widened to a steady ~55-85px so they can be jumped
  const wx=x+fbm(x/650,y/650,31,2)*240,wy=y+fbm(x/650+9,y/650,37,2)*240,RS=2400,e=24;
  const f0=fbm(wx/RS,wy/RS,23,2),fx=fbm((wx+e)/RS,wy/RS,23,2),fy=fbm(wx/RS,(wy+e)/RS,23,2);
  const g=Math.max(1e-5,Math.hypot(fx-f0,fy-f0)/e);
  const hw=(30+8*vn(x/500,y/500,29))*sstep(500,1100,d);
  const rv=(Math.abs(f0)/g-hw)/625;
  return[oc,rv,lakeTerm(x,y)];
}
const wfRaw=(x,y)=>{const q=wfParts(x,y);return Math.min(q[0],q[1],q[2])};
function waterKind(x,y){const q=wfParts(x,y),mn=Math.min(q[0],q[1],q[2]);return mn===q[0]?'ocean':mn===q[1]?'river':'lake'}
const humid=(x,y)=>fbm(x/2800+7,y/2800+3,51,3)*sstep(300,900,Math.hypot(x,y));
const biomeAt=(x,y)=>{const H=humid(x,y);return H>.17?2:H<-.17?1:0};   // 0 normal, 1 plains, 2 forest
const WG=new Map();let lci=1e9,lcj=1e9,lg=null;
function wgrid(ci,cj){
  if(ci===lci&&cj===lcj)return lg;
  const k=ci+','+cj;let g=WG.get(k);
  if(!g){g=new Float32Array(GN*GN);for(let j=0;j<GN;j++)for(let i=0;i<GN;i++)g[j*GN+i]=wfRaw((ci*GN+i)*GS,(cj*GN+j)*GS);WG.set(k,g)}
  lci=ci;lcj=cj;lg=g;return g;
}
function latt(i,j){const ci=Math.floor(i/GN),cj=Math.floor(j/GN);return wgrid(ci,cj)[(j-cj*GN)*GN+(i-ci*GN)]}
function wfAt(x,y){
  const gx=x/GS,gy=y/GS,i=Math.floor(gx),j=Math.floor(gy),fx=gx-i,fy=gy-j,a=latt(i,j),b=latt(i+1,j),c=latt(i,j+1),d=latt(i+1,j+1);
  return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy;
}
const dry=(x,y,r)=>{if(wfAt(x,y)<.006)return false;for(let k=0;k<8;k++){const a=k*.785;if(wfAt(x+Math.cos(a)*r,y+Math.sin(a)*r)<.006)return false}return true};
// what grows where: densities blend smoothly with humidity (dry plains -> normal -> humid forest) and thin out on ocean beaches
function densities(x,y){
  const H=humid(x,y),wP=1-sstep(-.25,-.05,H),wF=sstep(.1,.3,H),wN=Math.max(0,1-wP-wF),bch=sstep(.008,.03,ocF(x,y));
  const mix=(a,b,c)=>wP*a+wN*b+wF*c;
  return{wF,wP,tree:mix(.017,.10,.45)*bch,apple:mix(.006,.022,.02)*bch,rock:mix(.034,.057,.02),copper:mix(.014,.017,.008),iron:mix(.007,.008,.005)};
}
function genChunk(cx,cy){
  const k=cx+','+cy;if(CH.has(k))return CH.get(k);
  const R=rng(Math.imul(cx,73856093)^Math.imul(cy,19349663)^WSEED),ch={objs:[]},ox=cx*CS,oy=cy*CS;
  CH.set(k,ch);
  const tryPut=(type,x,y,r)=>{
    // every object stays fully inside its own chunk, so neighbouring chunks can never overlap each other
    if(x<ox+r+14||x>ox+CS-r-14||y<oy+r+14||y>oy+CS-r-14)return;
    if(Math.hypot(x,y)<150||!dry(x,y,r+10)||ch.objs.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+12))return;
    const o={type,x,y,r,seed:R()*100,prog:0,dead:0,v:Math.floor(R()*({tree:6,apple:2,rock:5}[type]||4))};
    if(type==='apple')o.fruit=2+Math.floor(R()*5);
    if(type==='tree'||type==='apple'){o.cx=x;o.cy=y+r*.55;o.cr=r*.32}else{o.cx=x;o.cy=y;o.cr=r*.8}
    ch.objs.push(o);
  };
  for(let n=0;n<75;n++){
    const x=ox+30+R()*(CS-60),y=oy+30+R()*(CS-60),q=R();
    if(wfAt(x,y)<.006)continue;
    const dn=densities(x,y);let acc=0,type=null;
    for(const tp of['tree','apple','rock','copper','iron']){acc+=dn[tp];if(q<acc){type=tp;break}}
    if(!type)continue;
    let r;
    if(type==='tree'){const u=R();r=R()<dn.wF?(u<.5?34+R()*16:u<.82?52+R()*24:78+R()*38):dn.wP>.5?28+R()*14:30+R()*16}
    else r=type==='apple'?34+R()*12:type==='rock'?22+R()*12:22+R()*10;
    tryPut(type,x,y,r);
  }
  const pb=biomeAt(ox+CS/2,oy+CS/2),pw=[[.5,.6,.35,.07,.025],[.5,.6,.5,.03,.01],[.35,.4,.15,.12,.05]][pb];
  // tall grass with seed heads, scattered around (more on the plains)
  for(let n=0,gc=Math.round([6,9,3][pb]*(.6+R()*.8));n<gc;n++){
    const x=ox+30+R()*(CS-60),y=oy+30+R()*(CS-60);
    if(wfAt(x,y)<.01||Math.hypot(x,y)<100||!dry(x,y,12)||ch.objs.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+14))continue;
    ch.objs.push({type:'grass',x,y,r:12,cx:x,cy:y,cr:8,seed:R()*100,prog:0,dead:0,v:0});
  }
  const pet=(kind,pc)=>{if(R()<pc){for(let n=0;n<6;n++){const x=ox+80+R()*(CS-160),y=oy+80+R()*(CS-160);if(Math.hypot(x,y)>(AN[kind].host?600:200)&&wfAt(x,y)>.01){mk(kind,x,y);return}}}};
  pet('pig',pw[0]);pet('chicken',pw[1]);pet('cow',pw[2]);pet('wolf',pw[3]);pet('bear',pw[4]);
  return ch;
}
function loadAround(){
  const pcx=Math.floor(P.x/CS),pcy=Math.floor(P.y/CS),ck=pcx+','+pcy;
  if(ck===lastCk)return;lastCk=ck;
  objs.length=0;
  for(let i=-2;i<=2;i++)for(let j=-2;j<=2;j++)for(const o of genChunk(pcx+i,pcy+j).objs)objs.push(o);
  if(P.boat&&!objs.includes(P.boat))objs.push(P.boat);
}
function spawnTick(){
  const act=animals.filter(a=>Math.hypot(a.x-P.x,a.y-P.y)<2000);
  if(act.length>=34)return;
  const nt=darkness()>.5,hostN=act.filter(a=>a.host).length;
  for(let tries=0;tries<8;tries++){
    const ang=rnd(0,6.283),d=rnd(700,1300),x=P.x+Math.cos(ang)*d,y=P.y+Math.sin(ang)*d;
    if(wfAt(x,y)<.01)continue;
    const bi=biomeAt(x,y);
    const w=[['chicken',40],['pig',30],['cow',bi===1?34:bi===2?10:22],['wolf',(nt?7:4)*(bi===2?2:1)],['bear',1.2*(bi===2?2:1)]].filter(q=>!(AN[q[0]].host&&hostN>=4));
    let r=Math.random()*w.reduce((sum,q)=>sum+q[1],0),kind=w[0][0];
    for(const q of w){if(r<q[1]){kind=q[0];break}r-=q[1]}
    mk(kind,x,y);return;
  }
}

// ---------- inventory ----------
const inv=Array(SLOTS).fill(null),hot=Array(5).fill(null),arm=[null,null,null,null],imgs={};let sel=0,FS=null;
const ARR=k=>k==='hot'?hot:k==='arm'?arm:inv;
const canAdd=t=>[inv,hot].some(A=>A.some(q=>q&&q.t===t&&q.n<STK(t)))||inv.includes(null)||hot.includes(null);
function add(t,quiet){
  let q=null;for(const A of[inv,hot]){q=A.find(z=>z&&z.t===t&&z.n<STK(t));if(q)break}
  if(!q){const A=inv.includes(null)?inv:hot.includes(null)?hot:null;if(!A)return false;q=A[A.indexOf(null)]={t,n:0}}
  q.n++;if(!quiet)render();return true;
}
function eat(A,i){
  const q=A[i];if(!q||!FOOD[q.t]||S.food>=100)return;
  S.food=Math.min(100,S.food+FOOD[q.t]);if(--q.n<=0)A[i]=null;render();
}
function move(sk,si,tk,ti){
  const A=ARR(sk),B=ARR(tk),a=A[si],b=B[ti];
  if(!a||(A===B&&si===ti))return;
  if((tk==='arm'&&!(ARM[a.t]&&ARM[a.t].slot===ti))||(sk==='arm'&&b&&!(ARM[b.t]&&ARM[b.t].slot===si))){say('That armor piece goes in a different slot');return}
  if(b&&b.t===a.t&&STK(a.t)>1){const mv=Math.min(STK(a.t)-b.n,a.n);b.n+=mv;a.n-=mv;if(a.n<=0)A[si]=null}
  else{A[si]=b;B[ti]=a}
  render();
}
function slot(k,i,hud){
  const A=ARR(k),q=A[i],d=document.createElement('div');

    d.insertAdjacentHTML('beforeend','<img draggable="false" src="'+imgs[q.t]+'" alt="'+IT[q.t]+'">'+(STK(q.t)===1?'':'<b>'+q.n+'</b>'));
    if(fb)d.style.boxShadow='inset 0 0 0 3px '+RAR[fb.r][1];
  }else if(k==='arm'){d.title=PIECES[i][1];d.insertAdjacentHTML('beforeend','<img draggable="false" style="opacity:.55" src="'+imgs['ph'+i]+'" alt="">')}
  d.ondragstart=e=>{e.dataTransfer.setData('text/plain',k+':'+i)};

const armorPts=()=>arm.reduce((n,q)=>n+(q?ARM[q.t].pts:0),0);

// ---------- crafting (6x6 recipe book) ----------
const REC=[{out:'stick',n:2,need:{wood:1}},{out:'string',n:2,need:{leather:2}},{out:'fishing_rod',n:1,need:{stick:3,string:2}},{out:'boat',n:1,need:{wood:6,stick:2}},{out:'bread',n:1,need:{wheat:3}}];
MATS.forEach(mt=>REC.push({out:'pick_'+mt,n:1,need:{[mt]:3,stick:2}}));
MATS.forEach(mt=>REC.push({out:'axe_'+mt,n:1,need:{[mt]:3,stick:2}}));
MATS.forEach(mt=>REC.push({out:'sword_'+mt,n:1,need:{[mt]:2,stick:1}}));
MATS.forEach(mt=>REC.push({out:'hoe_'+mt,n:1,need:{[mt]:2,stick:2}}));

let csel=0,tab='bag';
const have=t=>{let n=0;for(const A of[inv,hot])for(const q of A)if(q&&q.t===t)n+=q.n;return n};
const canCraft=r=>Object.keys(r.need).every(k=>have(k)>=r.need[k]);
function take(t,n){for(const A of[inv,hot])for(let i=0;i<A.length&&n>0;i++){const q=A[i];if(q&&q.t===t){const mv=Math.min(q.n,n);q.n-=mv;n-=mv;if(q.n<=0)A[i]=null}}}
function craft(i){
  const r=REC[i];if(!r)return;
  if(!canCraft(r)){say('Missing materials');return}
  for(const k in r.need)take(k,r.need[k]);
  for(let j=0;j<r.n;j++)if(!add(r.out,1))drop(r.out,P.x,P.y,1,.5);

}

  if(r)$('cb').onclick=()=>craft(csel);
}
function renderCraft(){

function useItem(){

// ---------- boats: sail on water, walk on land ----------
const footPts=(x,y,rr)=>[[x,y],[x+rr,y],[x-rr,y],[x,y+rr],[x,y-rr]];
const landOk=(x,y)=>footPts(x,y,12).every(q=>wfAt(q[0],q[1])>=0);
const boatOk=(x,y)=>footPts(x,y,24).every(q=>wfAt(q[0],q[1])<-.004);
function stepPlayer(dt){
  jumpReq=Math.max(0,jumpReq-dt);P.hintT=Math.max(0,P.hintT-dt);P.act=Math.max(0,P.act-dt);
  if(jumpReq>0&&P.z===0&&!P.boat){P.vz=430;P.z=.01;P.jx=P.x;P.jy=P.y;jumpReq=0}
  const nx=P.x+P.vx*dt,ny=P.y+P.vy*dt;
  if(P.boat){
    if(boatOk(nx,P.y))P.x=nx;else P.vx=0;
    if(boatOk(P.x,ny))P.y=ny;else P.vy=0;
    const b=P.boat;b.x=b.cx=P.x;b.y=b.cy=P.y;b.spd=Math.hypot(P.vx,P.vy);
    if(b.spd>20){let da=Math.atan2(P.vy,P.vx)-b.ang;da=Math.atan2(Math.sin(da),Math.cos(da));b.ang+=da*(1-Math.exp(-dt*5))}
  }else if(P.z>0){P.x=nx;P.y=ny}
  else{
    const free=wfAt(P.x,P.y)<0;let hit=false;
    if(free||landOk(nx,P.y))P.x=nx;else{P.vx=0;hit=true}
    if(free||landOk(P.x,ny))P.y=ny;else{P.vy=0;hit=true}
    P.wb=hit?P.wb+dt:0;
    if(P.wb>.45&&P.hintT<=0){say('Press Space to jump across narrow rivers');P.hintT=12;P.wb=0}
  }
  if(P.z>0){
    P.vz-=1400*dt;P.z+=P.vz*dt;
    if(P.z<=0){
      P.z=0;P.vz=0;P.sq=.12;
      if(!P.boat&&!landOk(P.x,P.y)){P.x=P.jx;P.y=P.jy;P.vx=P.vy=0;hurtT=.2;say('Splash! You fell in the water')}
    }
  }
  if(P.sq>0)P.sq-=dt;
}
function regBoat(b){for(const ch of CH.values()){const i=ch.objs.indexOf(b);if(i>=0)ch.objs.splice(i,1)}genChunk(Math.floor(b.x/CS),Math.floor(b.y/CS)).objs.push(b)}
function placeBoat(){
  const wx=m.x+Math.round(cam.x),wy=m.y+Math.round(cam.y);
  if(Math.hypot(wx-P.x,wy-P.y)>200){say('Too far - place the boat closer');return}
  if(!boatOk(wx,wy)){say('Boats go on open water');return}
  const o={type:'boat',x:wx,y:wy,ang:Math.atan2(wy-P.y,wx-P.x),r:34,cx:wx,cy:wy,cr:22,seed:Math.random()*100,prog:0,dead:0,v:0,spd:0};
  regBoat(o);objs.push(o);
  const q=hot[sel];if(--q.n<=0)hot[sel]=null;
  render();say('Boat placed. Right-click it (or press E) to get in');
}
function board(b){P.boat=b;P.x=b.x;P.y=b.y;P.vx=P.vy=0;say('In the boat. Press E or right-click the boat to get out')}
function dismount(){
  const b=P.boat;if(!b)return;
  for(const dd of[46,62,80,100,125])for(let k=0;k<16;k++){
    const a=k*.3927,x=b.x+Math.cos(a)*dd,y=b.y+Math.sin(a)*dd;
    if(landOk(x,y)&&wfAt(x,y)>.006&&!objs.some(o=>!o.dead&&!NOCOL.has(o.type)&&Math.hypot(o.cx-x,o.cy-y)<o.cr+P.r*.8)){
      P.boat=null;P.x=x;P.y=y;P.vx=P.vy=0;b.cx=b.x;b.cy=b.y;b.spd=0;regBoat(b);lastCk='';say('You got out of the boat');return;
    }
  }
  say('No shore nearby - sail closer to land');
}
function interactBoat(){
  const wx=m.x+Math.round(cam.x),wy=m.y+Math.round(cam.y);
  if(P.boat){if(Math.hypot(wx-P.boat.x,wy-P.boat.y)<50){dismount();return true}return false}
  const b=objs.find(o=>o.type==='boat'&&!o.dead&&Math.hypot(o.x-wx,o.y-wy)<46);
  if(b&&Math.hypot(b.x-P.x,b.y-P.y)<160){board(b);return true}
  return false;
}
function toggleBoat(){
  if(P.boat){dismount();return}
  const b=objs.find(o=>o.type==='boat'&&!o.dead&&Math.hypot(o.x-P.x,o.y-P.y)<150);
  if(b)board(b);else say('No boat nearby');
}

// ---------- fishing: cast at water, wait for a bite, then reel in on the green zone ----------
const hideReel=()=>{$('reel').style.display='none'};
function pickFish(kind){
  const mu=FMULT[kind];let tot=0;const ws=FISH.map(f=>{const w=f.w*(mu[f.id]||1);tot+=w;return w});
  let r=Math.random()*tot;
  for(let i=0;i<FISH.length;i++){if(r<ws[i])return FISH[i];r-=ws[i]}
  return FISH[0];
}
function cast(){
  const wx=m.x+Math.round(cam.x),wy=m.y+Math.round(cam.y);
  if(wfAt(wx,wy)>=-.003){say('Aim at the water to cast');return}
  if(Math.hypot(wx-P.x,wy-P.y)>230){say('Too far to cast - get closer to the water');return}
  const kind=waterKind(wx,wy);
  FS={kind,bx:wx,by:wy,t:0,wait:rnd(3,8)*(kind==='ocean'?.85:1)*(RN.k>.4?.75:1),ph:'wait',fish:null,bt:0,ph0:0,zone:.5,zw:.3,cur:.5};
  say('Cast into the '+kind+'... wait for a bite');
}
function fishUse(){
  if(!FS){cast();return}
  if(FS.ph==='wait'){FS=null;hideReel();say('You reeled in the line');return}
  const f=FS.fish,hit=Math.abs(FS.cur-FS.zone)<=FS.zw/2+.015;
  FS=null;hideReel();
  if(hit){const rr=RAR[f.r];if(!add(f.id))drop(f.id,P.x,P.y);say('Caught a '+f.n+'!  ('+rr[0]+')',rr[1])}
  else say('The fish got away!');
}
function fishUpdate(dt){
  if(!FS)return;
  const hq=hot[sel];
  if(!hq||hq.t!=='fishing_rod'||Math.hypot(FS.bx-P.x,FS.by-P.y)>300){FS=null;hideReel();say('You reeled in the line');return}
  FS.t+=dt;
  if(FS.ph==='wait'&&FS.t>=FS.wait){
    const f=pickFish(FS.kind);
    FS.ph='bite';FS.fish=f;FS.bt=0;FS.ph0=Math.random()*2;FS.zw=f.win;FS.zone=f.win/2+Math.random()*(1-f.win);
    $('reel').style.display='block';$('zone').style.left=((FS.zone-FS.zw/2)*100)+'%';$('zone').style.width=(FS.zw*100)+'%';
  }
  if(FS.ph==='bite'){
    FS.bt+=dt;const u=(FS.bt*FS.fish.sp+FS.ph0)%2;FS.cur=u<1?u:2-u;   // steady sweep back and forth
    $('cur').style.left=(FS.cur*100)+'%';
    if(FS.bt>4.5){FS=null;hideReel();say('The fish got away...')}
  }
}

// ---------- farming, tall grass and rain ----------
const SOIL=48;
const RN={on:false,k:0,t:0,dur:0,next:rnd(40,160)};
let grT=3;
function weatherUpdate(dt){
  if(RN.on){RN.t+=dt;if(RN.t>=RN.dur){RN.on=false;RN.next=rnd(150,480)}}
  else{RN.next-=dt;if(RN.next<=0){RN.on=true;RN.t=0;RN.dur=rnd(45,170);say('It started to rain')}}
  RN.k+=((RN.on?1:0)-RN.k)*(1-Math.exp(-dt*.7));
}
function farmUpdate(dt){
  for(const o of objs){
    if(o.type!=='soil'||o.dead)continue;
    o.wt=(o.wt||0)-dt;
    if(o.wt<=0){o.wt=1.5;o.wet=RN.k>.5||[0,1,2,3,4,5,6,7].some(k=>wfAt(o.x+Math.cos(k*.785)*80,o.y+Math.sin(k*.785)*80)<-.01)}
    if(o.crop)o.crop.g=Math.min(130,o.crop.g+dt*(o.wet?1.6:1)*o.fert);
  }
  grT-=dt;if(grT<=0){grT=3;grassTick()}
}
function grassTick(){
  let n=0;for(const o of objs)if(o.type==='grass'&&!o.dead)n++;
  if(n>=70)return;
  for(let tries=0;tries<6;tries++){
    const a=rnd(0,6.283),d=rnd(420,950),x=P.x+Math.cos(a)*d,y=P.y+Math.sin(a)*d;
    if(Math.random()>[.7,1,.4][biomeAt(x,y)])continue;
    if(wfAt(x,y)<.01||!dry(x,y,12)||objs.some(o=>!o.dead&&Math.hypot(o.x-x,o.y-y)<o.r+16))continue;
    const g={type:'grass',x,y,r:12,cx:x,cy:y,cr:8,seed:Math.random()*100,prog:0,dead:0,v:0};
    genChunk(Math.floor(x/CS),Math.floor(y/CS)).objs.push(g);objs.push(g);return;
  }
}
function till(q){
  const wx=m.x+Math.round(cam.x),wy=m.y+Math.round(cam.y);
  if(Math.hypot(wx-P.x,wy-P.y)>140){say('Too far - move closer to till');return}
  const sx=Math.floor(wx/SOIL)*SOIL+SOIL/2,sy=Math.floor(wy/SOIL)*SOIL+SOIL/2;
  if(wfAt(sx,sy)<.02||!landOk(sx,sy)){say("Can't till here");return}
  if(objs.some(o=>!o.dead&&o.type==='soil'&&o.x===sx&&o.y===sy)){say('Already tilled');return}
  if(objs.some(o=>!o.dead&&!NOCOL.has(o.type)&&Math.hypot(o.cx-sx,o.cy-sy)<o.cr+22)){say('Something is in the way');return}

  list.push({type:'player',y:P.y+P.r});
  list.sort((a,b)=>key(a)-key(b));
  for(const o of list)o.type==='player'?drawPlayer(t):o.type==='boat'?drawBoat(o,t,o===tgt):o.an?drawAnimal(o,t,o.hit>0):drawObj(o,t,o===tgt);
  for(const o of list){
    if(o.type==='player')continue;
    if(o.an){
      if(o.hp>=o.mhp)continue;
      const by=o.y-o.r-24;rrect(o.x-18,by,36,10,5,'#fff',2.5);rrect(o.x-16,by+2,Math.max(6,32*o.hp/o.mhp),6,3,'#ff3b4e',1.5);
    }else if(o.prog>0){
      const by=(o.type==='tree'||o.type==='apple'?o.y-o.r*1.2:o.y-o.r)-20;
      rrect(o.x-28,by,56,12,6,'#fff',3);
      if(o.prog>.03)rrect(o.x-26,by+2,Math.max(8,52*o.prog),8,4,'#2ecc71',2);
    }
  }
  for(let i=pops.length-1;i>=0;i--){
    const q=pops[i];q.t+=dt;if(q.t>.8){pops.splice(i,1);continue}
    const yy=q.y-q.t*34;
    ctx.globalAlpha=1-q.t/.8;ctx.font='bold '+(q.big?18:13)+'px sans-serif';ctx.textAlign='center';ctx.lineWidth=3;ctx.lineJoin='round';ctx.strokeStyle=INK;ctx.strokeText(q.txt,q.x,yy);ctx.fillStyle=q.big?'#ffd23f':'#fff';ctx.fillText(q.txt,q.x,yy);
    if(q.big&&q.t<.3){ctx.strokeStyle='#ffd23f';ctx.lineWidth=2;for(let k=0;k<7;k++){const aa=k*.898,r0=8+q.t*80;ctx.beginPath();ctx.moveTo(q.x+Math.cos(aa)*r0,q.y+8+Math.sin(aa)*r0);ctx.lineTo(q.x+Math.cos(aa)*(r0+7),q.y+8+Math.sin(aa)*(r0+7));ctx.stroke()}}
    ctx.globalAlpha=1;ctx.textAlign='left';
  }
  drawFishing(t);
  ctx.restore();
  drawRain(dt);
  // night: dark, with a pool of light around the player
  if(dk>0){
    const sx=P.x-cx,sy=P.y-cy,g=ctx.createRadialGradient(sx,sy,70,sx,sy,Math.max(W,H)*.6);
    g.addColorStop(0,'rgba(6,10,38,'+(.22*dk)+')');g.addColorStop(.4,'rgba(6,10,38,'+(.62*dk)+')');g.addColorStop(1,'rgba(6,10,38,'+(.84*dk)+')');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  if(hurtT>0){ctx.fillStyle='rgba(255,30,50,'+(hurtT*.5)+')';ctx.fillRect(0,0,W,H)}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
